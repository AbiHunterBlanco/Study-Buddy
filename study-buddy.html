<style>
:root{--bg:#f7e3cf;--card:#fff6ea;--ink:#5b3f3a;--acc:#f08a6c;--acc2:#f7c59f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#4a3430;--ink:#ffe9d6;--bg:#2b1f24;--acc2:#5a4348}}
:root[data-theme="dark"]{--card:#4a3430;--ink:#ffe9d6;--bg:#2b1f24;--acc2:#5a4348}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:800;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#title{position:fixed;top:7vh;left:0;right:0;text-align:center;pointer-events:none}
h1{margin:0;font:700 clamp(44px,10vw,92px)/1 "Pixelify Sans",monospace;color:#fff6ea;text-shadow:3px 3px 0 var(--acc),6px 6px 0 #5b3f3a}
#title p{margin:14px 0 0;font-size:clamp(14px,2.5vw,18px);color:#5b3f3a;opacity:.85}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:var(--acc2);border-radius:10px;padding:8px 12px;box-shadow:0 3px 0 rgba(91,63,58,.35);transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:none}
button.on{background:var(--acc);color:#fff}
#play{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);font:700 28px "Pixelify Sans",monospace;padding:14px 38px;background:var(--acc);color:#fff;box-shadow:0 6px 0 #b9573f;border-radius:14px}
#play:active{transform:translateX(-50%) translateY(5px)}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 5px 0 rgba(91,63,58,.3),0 10px 30px rgba(0,0,0,.15)}
#timer{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);text-align:center;width:min(94vw,370px)}
#clock{font:600 56px Fredoka,Nunito,system-ui,sans-serif;font-variant-numeric:tabular-nums;margin:4px 0;min-width:140px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#tools{display:inline-flex;gap:6px}
#timer,#pal,#deco{cursor:grab;touch-action:none}
.sw.on{outline:3px solid var(--ink);outline-offset:1px}
#timer button{cursor:pointer}
#dots{font-size:13px;letter-spacing:2px;min-height:18px;opacity:.8}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#hud #tools button{animation:pop .5s cubic-bezier(.3,1.7,.5,1) backwards}
#tools button:nth-child(2){animation-delay:.1s}#tools button:nth-child(3){animation-delay:.2s}#tools button:nth-child(4){animation-delay:.3s}
#tools button{font-size:16px;padding:7px 9px;transition:none}
#deco{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(260px + env(safe-area-inset-bottom,0px));width:min(86vw,300px);font-size:13px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 320px);overflow:auto}
#deco b{display:block;margin-bottom:3px}
.sw{width:26px;height:26px;padding:0;border-radius:8px;border:2px solid #fff}
#pal{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(260px + env(safe-area-inset-bottom,0px));width:min(86vw,300px);font-size:13px;display:flex;flex-direction:column;gap:8px}
@media (max-height:640px){#clock{font-size:40px}}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input[type=number]{font:inherit;width:4.5em;padding:6px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:#1f1612}
#tools svg,#wx svg,#pt svg{display:block}
@media (prefers-reduced-motion:reduce){#hud #tools button{animation:none}}
[hidden]{display:none!important}
</style></head><body>
<div id="title"><h1>Study Buddy</h1><p>a tiny room to focus in</p></div>

<div id="hud" hidden>
  <div id="pal" class="card" hidden><b>Paint</b><div>Pick a colour, then tap things in the room to paint them.</div><div id="sw2" class="row" style="justify-content:flex-start"></div><label>Custom colour <input id="cc" type="color" value="#f08a6c"></label></div>

  <div class="row"><button id="go" class="on">Start</button><button id="rst">Reset</button><span id="tools"><button id="bPaint" title="Paint" aria-label="Paint"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg></button><button id="bFocus" title="Study view" aria-label="Study view"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button><button id="bDeco" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button><button id="bMute" title="Sound" aria-label="Sound on"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button></span></div>
 </div>
 <div id="deco" class="card" hidden>
      <div><b>Hair</b><div class="row" id="hs" style="justify-content:flex-start"></div></div>
  <div><b>Pet</b><div class="row" id="pt" style="justify-content:flex-start"></div></div>
    <div><b>Window weather</b><div class="row" id="wx" style="justify-content:flex-start"><button data-w="clear" title="Clear" aria-label="Clear"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button><button data-w="rain" title="Rain" aria-label="Rain"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M16 14v6M8 14v6M12 16v6"/></svg></button><button data-w="snow" title="Snow" aria-label="Snow"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg></button></div></div>
  <div><b>Time of day <span id="hl"></span></b><input id="hr" aria-label="Time of day" type="range" min="0" max="24" step=".25" style="width:100%"><button id="auto" class="on">Use my local time</button></div>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0];
const S={wall:'#f6d5b8',floor:'#d9a273',shirt:'#f08a6c',hair:'#6b4430',weather:'clear',hour:null,mute:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('cozy')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cozy',JSON.stringify(S))}catch(e){}};

/* ---------- sound ---------- */
let AC;
function tone(f,t=.09,v=.14,f2){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f2||f*1.8,n+t);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g).connect(AC.destination);o.start();o.stop(n+t)}catch(e){}}
const pop=()=>tone(280+Math.random()*140,.09);
const chime=()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.4,.15,f),i*160));

/* ---------- scene ---------- */
const R=new THREE.WebGLRenderer({antialias:false});R.shadowMap.enabled=true;document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);
function resize(){const a=innerWidth/innerHeight;R.setSize(innerWidth*.5,innerHeight*.5,false);cam.aspect=a;cam.fov=a<1?Math.min(78,30/a+14):40;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const M=c=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:1});
function mk(geo,c,x=0,y=0,z=0,p){const m=new THREE.Mesh(geo,c.isMaterial?c:M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p&&p.add(m);return m}
const bx=(w,h,d,c,x,y,z,p)=>mk(new THREE.BoxGeometry(w,h,d),c,x,y,z,p);
const cy=(r1,r2,h,s,c,x,y,z,p)=>mk(new THREE.CylinderGeometry(r1,r2,h,s),c,x,y,z,p);
const room=new THREE.Group();scene.add(room);
const hemi=new THREE.HemisphereLight('#fff1e0','#caa58a',.7),sun=new THREE.DirectionalLight('#ffe2b8',.9);
sun.position.set(4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:20});
scene.add(hemi,sun);

const wallM=M('#f6d5b8'),floorM=M('#d9a273'),shirtM=M('#f08a6c'),hairM=M('#6b4430');
bx(6.2,.2,6.2,floorM,0,-.1,0,room);
bx(6.2,3,.2,wallM,0,1.5,-3.1,room);bx(.2,3,6.2,wallM,-3.1,1.5,0,room);
bx(6.2,.15,.1,'#fff6ea',0,.08,-2.95,room);bx(.1,.15,6,'#fff6ea',-2.95,.08,0,room);

/* window with live sky */
const wc=document.createElement('canvas');wc.width=64;wc.height=48;const wx=wc.getContext('2d');
const wt=new THREE.CanvasTexture(wc);wt.magFilter=wt.minFilter=THREE.NearestFilter;
mk(new THREE.PlaneGeometry(1.9,1.4),new THREE.MeshBasicMaterial({map:wt}),0,1.9,-2.99,room);
[[2.1,.1,0,2.65],[2.1,.1,0,1.15],[.1,1.5,-1,1.9],[.1,1.5,1,1.9],[.06,1.4,0,1.9]].forEach(([w,h,x,y])=>bx(w,h,.1,'#fff6ea',x,y,-2.95,room));
const cl=new THREE.Group(),cr=new THREE.Group();cl.position.set(-1.4,1.9,-2.9);cr.position.set(1.4,1.9,-2.88);room.add(cl,cr);bx(1.5,1.7,.12,'#f4a6a6',.75,0,0,cl);bx(1.5,1.7,.12,'#f4a6a6',-.75,0,0,cr);cl.scale.x=cr.scale.x=S.cc?1:.24;
function toggleCurtains(){S.cc=!S.cc;save();tone(S.cc?420:300,.25,.12,S.cc?300:420);[cl,cr].forEach(c=>gsap.to(c.scale,{x:S.cc?1:.24,duration:.7,ease:'back.out(1.4)'}));burst(new THREE.Vector3(0,1.9,-2.7),6,.8,1)}

const K=[[0,'#1c2142'],[5.5,'#3a3566'],[7,'#f6a98c'],[9,'#bfe6f2'],[16.5,'#c9e8ef'],[18.5,'#f19a78'],[20,'#3a3566'],[24,'#1c2142']];
const hour=()=>S.hour??(new Date().getHours()+new Date().getMinutes()/60);
function skyAt(h){for(let i=0;i<K.length-1;i++)if(h<=K[i+1][0])return new THREE.Color(K[i][1]).lerp(new THREE.Color(K[i+1][1]),(h-K[i][0])/(K[i+1][0]-K[i][0]));return new THREE.Color(K[0][1])}
const dayl=h=>Math.max(0,Math.min(1,1-Math.abs(h-12.5)/7));
function drawWin(t){
 const h=hour(),dl=dayl(h),night=h<6.2||h>19.5,w=S.weather,c=skyAt(h);
 if(w!=='clear')c.lerp(new THREE.Color('#8f9aa8'),.45);
 wx.fillStyle='#'+c.getHexString();wx.fillRect(0,0,64,48);
 if(night&&w==='clear'){wx.fillStyle='#fff6d0';for(let i=0;i<14;i++)wx.fillRect((i*29)%64,(i*17)%28,1,1)}
 if(w==='clear'){const a=night?((h+6)%24)/12:(h-6)/12.5;wx.fillStyle=night?'#fff3c4':'#ffe08a';wx.fillRect(6+a*48|0,38-Math.sin(a*Math.PI)*30|0,6,6)}
 wx.fillStyle=night?'#4a4a78':'#fff';wx.globalAlpha=w==='clear'?.8:1;
 [[0,8],[30,14],[46,5]].forEach(([x,y],i)=>{const px=((x+t*(2+i))%84)-14;wx.fillRect(px,y,12,4);wx.fillRect(px+3,y-2,7,2)});wx.globalAlpha=1;
 wx.fillStyle='#'+new THREE.Color('#8fc79a').multiplyScalar(.3+.7*dl).getHexString();wx.fillRect(0,38,64,10);
 wx.fillStyle='#'+new THREE.Color('#6fb085').multiplyScalar(.3+.7*dl).getHexString();wx.fillRect(0,43,64,5);
 wx.fillStyle='#e8f2ff';
 if(w==='rain')for(let i=0;i<28;i++)wx.fillRect((i*23)%64,((i*13+t*60)%48),1,3);
 if(w==='snow')for(let i=0;i<30;i++)wx.fillRect(((i*19+Math.sin(t+i)*3)%64+64)%64,((i*11+t*10)%48),1.5,1.5);
 wt.needsUpdate=true}

/* desk + character */
const pivot=new THREE.Group(),inner=new THREE.Group(),desk=new THREE.Group();inner.position.z=1.6;pivot.add(inner);inner.add(desk);
bx(2.2,.1,.9,'#b57a4f',0,.8,-1.3,desk);
[[-1,-1.65],[1,-1.65],[-1,-.95],[1,-.95]].forEach(([x,z])=>bx(.1,.8,.1,'#8a5a3c',x*1.0,.4,z,desk));
bx(.5,.03,.38,'#fff0e0',0,.87,-1.3,desk);bx(.36,.02,.02,'#f08a6c',-.02,.89,-1.24,desk);bx(.36,.02,.02,'#f08a6c',-.02,.89,-1.34,desk);bx(.04,.04,.3,'#f2c14e',.2,.9,-1.36,desk);
const mug=cy(.09,.08,.14,8,'#9bd0c9',.7,.92,-1.2,desk);
bx(.8,.1,.8,'#c76f6f',0,.5,-2.05,inner);bx(.8,.8,.1,'#c76f6f',0,.95,-2.45,inner);cy(.05,.05,.5,6,'#7a5a4a',0,.25,-2.05,inner);
const ch=new THREE.Group();ch.position.set(0,0,-2.05);inner.add(ch);
bx(.62,.72,.4,shirtM,0,.95,0,ch);
const head=new THREE.Group();head.position.y=1.62;ch.add(head);
bx(.55,.5,.5,'#f4c9a8',0,0,0,head);const hg=new THREE.Group();head.add(hg);
const HS={
 short:g=>{bx(.6,.2,.56,hairM,0,.3,0,g);bx(.6,.13,.1,hairM,0,.17,.27,g);bx(.6,.25,.1,hairM,0,.15,-.28,g)},
 curly:g=>{bx(.58,.16,.54,hairM,0,.28,0,g);const ic=(r,x,y,z)=>mk(new THREE.IcosahedronGeometry(r,0),hairM,x,y,z,g);
  [[-.2,.34,-.1],[.05,.36,-.1],[.25,.32,-.05],[-.1,.32,.12],[.15,.31,.12]].forEach(([x,y,z])=>ic(.14,x,y,z));
  [-.3,.3].forEach(x=>[.12,-.03].forEach(y=>ic(.14,x,y,-.05)));
  [-.2,0,.2].forEach(x=>[.12,-.08].forEach(y=>ic(.15,x,y,-.3)));
  [-.22,0,.22].forEach(x=>ic(.1,x,.26,.27))},
 bob:g=>{bx(.6,.2,.56,hairM,0,.3,0,g);bx(.6,.15,.1,hairM,0,.17,.27,g);bx(.66,.5,.1,hairM,0,.02,-.28,g);[-.31,.31].forEach(x=>bx(.08,.4,.5,hairM,x,.05,-.02,g))},
 long:g=>{bx(.6,.2,.56,hairM,0,.3,0,g);bx(.6,.13,.1,hairM,0,.17,.27,g);bx(.6,.95,.1,hairM,0,-.2,-.28,g);[-.3,.3].forEach(x=>bx(.08,.7,.5,hairM,x,-.05,-.02,g))},
 pigtails:g=>{bx(.6,.2,.56,hairM,0,.3,0,g);bx(.6,.14,.1,hairM,0,.17,.27,g);bx(.6,.3,.1,hairM,0,.12,-.28,g);[-.4,.4].forEach(x=>{bx(.14,.5,.14,hairM,x,-.1,-.1,g);bx(.1,.1,.1,'#f08a6c',x,.18,-.1,g)})}};
function setHair(n){while(hg.children.length)hg.remove(hg.children[0]);HS[n](hg);hg.traverse(m=>m.isMesh&&(m.userData.oc=m.material===hairM?0x6b4430:m.material.color.getHex()));S.hs=n;save()}
if(S.hs==='spiky')S.hs='curly';setHair(HS[S.hs]?S.hs:'bob');
const eyes=new THREE.Group();eyes.position.z=.26;head.add(eyes);bx(.07,.11,.02,'#3a2a2a',-.13,0,0,eyes);bx(.07,.11,.02,'#3a2a2a',.13,0,0,eyes);
bx(.1,.06,.02,'#f4a0a0',-.2,-.1,.26,head);bx(.1,.06,.02,'#f4a0a0',.2,-.1,.26,head);
const armL=bx(.16,.16,.5,shirtM,-.38,1.0,.3,ch),armR=bx(.16,.16,.5,shirtM,.38,1.0,.3,ch);
[-.17,.17].forEach(x=>{bx(.2,.2,.5,'#7a5c6e',x,.6,.1,ch);bx(.2,.5,.2,'#7a5c6e',x,.3,.3,ch)});

/* draggable furniture */
const D=[];let sel=null;
function reg(g,x,z){g.position.set(x,0,z);g.userData.drag=true;room.add(g);D.push(g);return g}
reg(pivot,0,-1.6);

t.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,label'))return;const r=t.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top};gsap.killTweensOf(t);t.setPointerCapture(e.pointerId);t.style.cursor='grabbing';place(r.left,r.top)});
t.addEventListener('pointermove',e=>{if(d)place(e.clientX-d.dx,e.clientY-d.dy)});
const end=()=>{if(d){d=null;t.style.cursor='';pop()}};t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end)}
mover($('#timer'));mover($('#pal'));mover($('#deco'));
function chips(id,list,cur,set,fx){const r=$(id),upd=()=>[...r.children].forEach(b=>{const on=b.dataset.k===cur();b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 list.forEach(([k,l,ic])=>{const b=document.createElement('button');if(ic){b.innerHTML=ic;b.title=l;b.setAttribute('aria-label',l)}else b.textContent=l;b.dataset.k=k;b.onclick=()=>{set(k);upd();burst(fx(),10,1.5,3)};r.appendChild(b)});upd()}
chips('#hs',[['short','Short'],['curly','Curly'],['bob','Bob'],['long','Long'],['pigtails','Pigtails']],()=>S.hs||'bob',setHair,()=>head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0,.4,0)));
chips('#pt',[['cat','Cat'],['dog','Dog'],['gecko','Gecko']],()=>S.pet||'cat',setPet,()=>pet.position.clone().setY(.5));
sync();setInterval(sync,30000);
setInterval(()=>gsap.to(eyes.scale,{y:.1,duration:.07,yoyo:true,repeat:1}),3200);
loop();
